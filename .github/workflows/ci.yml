name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (all JS / MJS)
        shell: bash
        run: |
          set -euo pipefail
          # 只查语法，不执行；用户脚本没有构建产物，扫源文件即可。
          git ls-files '*.js' '*.mjs' '*.cjs' | while read -r f; do
            node --check "$f"
          done

      - name: Userscript metadata sanity
        run: node tools/check-userscript-meta.mjs

      - name: README version column matches @version
        run: node tools/sync-readme-versions.mjs --check

      - name: Docs link and metadata check
        run: node tools/check-docs.mjs
