name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (all JS / MJS)
        shell: bash
        run: |
          set -euo pipefail
          # 只查语法，不执行；用户脚本没有构建产物，扫源文件即可。
          git ls-files '*.js' '*.mjs' '*.cjs' | while read -r f; do
            node --check "$f"
          done

      - name: Userscript metadata sanity
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in src/*/*.user.js; do
            for key in '@name' '@version' '@license' '@downloadURL' '@updateURL' '@match'; do
              if ! grep -q -- "$key" "$f"; then
                echo "::error file=$f::missing metadata $key"
                fail=1
              fi
            done
            v=$(grep -m1 -oP '^\s*//\s*@version\s+\K\S+' "$f")
            if ! printf '%s' "$v" | grep -Eq '^\d+\.\d+\.\d+$'; then
              echo "::error file=$f::@version is not x.y.z"
              fail=1
            fi
          done
          exit $fail

      - name: README version column matches @version
        run: node tools/sync-readme-versions.mjs --check

      - name: Docs link and metadata check
        run: node tools/check-docs.mjs
